name: Python application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        pip install -r requirements.txt

    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check --output-format=github --select=E9,F63,F7,F82 --target-version=py310 .
        # standard pycodestyle/pyflakes checks with GitHub Annotations
        ruff check --output-format=github --select=E4,E7,E9,F --target-version=py310 .

    - name: Test with pytest
      run: pytest -q
