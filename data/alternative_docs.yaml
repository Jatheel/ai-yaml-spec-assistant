- name: ISO 22000
  key: iso_22000
  mandatory_documents:
  - ISO 22000:2018 Certificate
  - Hazard Analysis and Critical Control Points (HACCP) Plan
  alternative_groups:
  - combination_required: true
    score: 0.9
    documents:
    - Food Safety Management System (FSMS) Manual
    - Internal Audit Records
    - Food Safety Improvement Plan
    - Food Safety Policy
    condition: This group collectively verifies the organization's comprehensive Food Safety Management System including scope,
      certification body identity, internal audit effectiveness, management commitment, and continual improvement aligned
      with ISO 22000.
    fields_to_match:
    - organization_name
    - certificate_scope
    - certification_body_name
    - legal_compliance_status
    error_recovery:
    - error_type: missing_records
      action: request_internal_followup
      message: Internal Audit Records are missing or incomplete. Please provide updated audit reports.
    - error_type: outdated_manual
      action: request_update
      message: The FSMS Manual is outdated or missing certification body information. Please upload the latest version.
    - error_type: missing_policy
      action: request_policy_submission
      message: Food Safety Policy document is missing. Please provide the current policy.
    - error_type: no_improvement_plan
      action: request_creation
      message: Food Safety Improvement Plan is not available. Please develop and submit the plan.
  - combination_required: true
