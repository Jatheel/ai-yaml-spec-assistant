- name: SQF
  key: sqf
  mandatory_documents:
  - SQF Certificate
  - Audit Report by an accredited certification body
  alternative_groups:
  - combination_required: true
    score: 0.9
    documents:
    - HACCP Plan & Food Safety Procedures
    - Scope of Certification Document
    - Management Commitment Evidence
    - Food Safety and Quality Management System Records
    condition: All documents must be issued by or refer to the same certification body and consistently match scope and organizational
      details. The Management Commitment Evidence and System Records must demonstrate that the site maintains its food safety
      responsibilities and governance. The Scope of Certification Document and HACCP Plan must validate the certified processes.
    fields_to_match:
    - organization_name
    - organization_address
    - certificate_scope
    - certification_body_name
    error_recovery:
    - error_type: unlicensed_certification_body
      action: cross_check_external_source
      message: The certification body does not appear in the SQF Licensed Certification Body list. Please verify or upload
        a certificate issued by a recognized body.
    - error_type: mismatched_scope
      action: cross_check_internal_consistency
      message: Scope details are inconsistent across the supporting documents. Please confirm and reupload consistent documentation.
  - combination_required: true
    score: 0.85
    documents:
