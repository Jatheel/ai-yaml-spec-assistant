# Generic synthetic specification data for demonstration and testing only.
# It contains no supplier records, company identifiers, or confidential values.
badges:
- name: FSSC 22000
  key: fssc_22000
  mandatory_documents:
  - FSSC 22000 Certificate
  alternative_groups:
  - combination_required: true
    score: 0.9
    documents:
    - Certification contract
    - HACCP Plan & Food Safety Procedures
    - Technical review report
    condition: The same certification body signed at the certification contract should appear at the technical review report.The
      HACCP Plan and records on other food safety procedures should demonstrate the organization is maintaining and concerning
      on food safety measures.The final decision on the certification status should be appear in the technical review report.
    fields_to_match:
    - organization_name
    - organization_address
    - certificate_scope
    - certification_body_name
    error_recovery:
    - error_type: unlicensed_certification_body
      action: cross_check_external_source
      message: The certification body is not recognized or does not match between the Certification Contract and Technical
        Review Report. Please cross-check with the FSSC Public Register or upload a document issued by an accredited certification
        body.
    - error_type: mismatched_scope
      action: cross_check_external_source
      message: The certificate scope does not match across the Certification Contract, HACCP Plan, and Technical Review Report.
        Please cross-check the scope with the FSSC Public Register or upload documents with a consistent scope.
  - combination_required: true
    score: 0.9
    documents:
    - Audit Report from accredited certification body
    - Technical review report
    condition: Both the audit report and technical review report should be issued by the same certification body and should
      be on the same scope,issued at a same time period and confirm the organization adhere to the applied scope of the certificate.
    fields_to_match:
    - organization_name
    - organization_address
    - certificate_version
    - certificate_scope
    - date_of_issuance
    - date_of_expiry
    - certification_body_name
    error_recovery:
    - error_type: unlicensed_certification_body
      action: cross_check_external_source
      message: The certification body is not recognized or does not match between documents. Please cross-check with the FSSC
        Public Register or upload a document issued by an accredited certification body.
    - error_type: inconsistent_date
      action: cross_check_external_source
      message: The issuance or expiry date is inconsistent between the Audit Report and Technical Review Report. Please cross-check
        the date with the FSSC Quality Public Register or upload documents with consistent dates.
    - error_type: mismatched_scope
      action: cross_check_external_source
      message: The certificate scope does not match between the Audit Report and Technical Review Report. Please cross-check
        the scope with the FSSC Quality Public Register or upload documents with a consistent scope.
  - combination_required: true
    score: 0.6
    documents:
    - Audit Report from accredited certification body
    - Self Declaration
    condition: Both the audit report and self declaration should be refer to the same scope of the same organization.
    fields_to_match:
    - organization_name
    - organization_address
    - certificate_scope
    - date_of_issuance
    error_recovery:
    - error_type: corrupted_file
      action: request_reupload
      message: One document is unreadable. Please reupload a clear copy.
    - error_type: mismatched_scope
      action: cross_check_external_source
      message: The certificate scope does not match between the Audit Report and Self Declaration. Please cross-check the
        scope with the FSSC Public Register or upload documents with a consistent scope.
  - combination_required: true
    score: 0.4
    documents:
    - Internal Audit Report
    - Self Declaration
    condition: Both the audit report and self declaration should be refer to the same scope of the same organization.
    fields_to_match:
    - organization_name
    - organization_address
    - certificate_scope
    error_recovery:
    - error_type: corrupted_file
      action: request_reupload
      message: The uploaded document is unreadable. Please reupload a clear copy.
    - error_type: missing_address
      action: request_corrected_document
      message: The organization address is missing in one or both documents. Please upload a corrected Internal Audit Report
        or Self Declaration that includes the complete address (street number, street name, city, state, country).
    - error_type: mismatched_scope
      action: cross_check_external_source
      message: The certificate scope does not match between the Internal Audit Report and Self Declaration. Please cross-check
        the scope with the FSSC Quality Public Register or upload documents with a consistent scope.
    - error_type: missing_name
      action: request_corrected_document
      message: The organization name is missing in one or both documents. Please upload a corrected Internal Audit Report
        or Self Declaration that includes the organization name.
  available_alternative_documents:
  - title: Certification contract
    description: A formal agreement between the organization and the certification body. It outlines the terms and conditions
      under which the certification is provided, including responsibilities, timelines, and scope. This document must be signed
      by the same certification body listed in the technical review report and should include clauses covering the scope of
      the certification, rights and obligations of both parties, and terms of validity.
    provides_fields:
    - field: organization_name
      confidence: 1
    - field: organization_address
      confidence: 1
    - field: certification_body_name
      confidence: 1
    - field: date_of_issuance
      confidence: 1
    - field: certification_body_address
      confidence: 1
    - field: signatory_name
      confidence: 1
    - field: signatory_position
      confidence: 1
    availability:
      likelihood: common
      sources:
      - internal
      - certification_body
      - supplier
      estimated_access_time: 1-3 days
  - title: HACCP Plan & Food Safety Procedures
    description: This document details the Hazard Analysis Critical Control Point (HACCP) system implemented by the organization
      to ensure food safety. It should contain a thorough analysis of food safety hazards, identification of critical control
      points, and procedures for monitoring and verification. The plan must be relevant to the scope of certification and
      align with ISO 22000 principles. It should also outline corrective actions in case of deviations and include records
      of food safety monitoring.
    provides_fields:
    - field: organization_name
      confidence: 1
    - field: organization_address
      confidence: 0.7
    - field: certificate_scope
      confidence: 0.7
    - field: category
      confidence: 0.4
    - field: signatory_name
      confidence: 0.4
    - field: signatory_position
      confidence: 0.4
    availability:
      likelihood: common
      sources:
      - internal
      - supplier
      estimated_access_time: 1-2 days
  - title: Internal Audit Report
    description: An internal audit report is a document produced by the organization's internal personnel, typically those
      with expertise in food safety and auditing.It offers a detailed account of audits conducted within the organization
      to verify and analyze any gaps in compliance before the formal audits by certification bodies.This report should include
      findings from the audit, an assessment of existing food safety practices, and a list of corrective actions or improvements
      needed. The report should reference the current version of the food safety plan and demonstrate the commitment of the
      organization to continuous improvement.
    provides_fields:
    - field: organization_name
      confidence: 1
    - field: organization_address
      confidence: 1
    - field: certificate_version
      confidence: 1
    - field: certificate_scope
      confidence: 1
    - field: category
      confidence: 1
    - field: date_of_issuance
      confidence: 1
    - field: signatory_name
      confidence: 0.9
    - field: signatory_position
      confidence: 0.9
    availability:
      likelihood: common
      sources:
      - internal
      - supplier
      estimated_access_time: 1-2 days
  - title: Technical review report
    description: A technical review report is a document prepared by the certification body that evaluates the organization's
      adherence to FSSC 22000 standards. It must reference the completed audit and confirm that the organization is compliant
      with the required standards. The report should summarize audit findings, outline any non-conformities found, and include
      recommendations for achieving compliance and must be signed by a leading person in the audit team.
    provides_fields:
    - field: organization_name
      confidence: 1
    - field: organization_address
      confidence: 0.7
    - field: certificate_version
      confidence: 1
    - field: certificate_scope
      confidence: 1
    - field: category
      confidence: 1
    - field: certification_body_name
      confidence: 1
    - field: date_of_issuance
      confidence: 1
    - field: date_of_expiry
      confidence: 0.8
    - field: certification_body_address
      confidence: 0.7
    - field: certification_body_logo
      confidence: 1
    - field: signatory_name
      confidence: 1
    - field: signatory_position
      confidence: 1
    availability:
      likelihood: rare
      sources:
      - certification_body
      estimated_access_time: 3-5 days
  - title: Audit Report from accredited certification body
    description: An audit report prepared by an accredited certification body after conducting an official audit of the organization's
      food safety management system. This report offers a detailed evaluation of the organization's compliance with the relevant
      certification standards.It should include information on the audit scope, audit methodology,audit date time and duration,
      findings, non-conformities, and any corrective actions required.
    provides_fields:
    - field: organization_name
      confidence: 1
    - field: organization_address
      confidence: 1
    - field: certificate_version
      confidence: 1
    - field: certificate_scope
      confidence: 1
    - field: category
      confidence: 1
    - field: certification_body_name
      confidence: 1
    - field: date_of_issuance
      confidence: 1
    - field: certification_body_address
      confidence: 1
    - field: certification_body_logo
      confidence: 1
    - field: signatory_name
      confidence: 1
    - field: signatory_position
      confidence: 1
    availability:
      likelihood: modest
      sources:
      - certification_body
      estimated_access_time: 1-3 days
  - title: Self Declaration
    description: A self-declaration is a formal statement made by the organization asserting that it complies with the relevant
      standards, regulations, and requirements for certification. This document is typically signed by senior management and
      serves as a declaration verifying some information on the organization.
    provides_fields:
    - field: organization_name
      confidence: 1
    - field: organization_address
      confidence: 1
    - field: certificate_version
      confidence: 1
    - field: certificate_scope
      confidence: 0.7
    - field: category
      confidence: 0.5
    - field: certification_body_name
      confidence: 0.5
    - field: date_of_issuance
      confidence: 1
    - field: signatory_name
      confidence: 1
    - field: signatory_position
      confidence: 1
    availability:
      likelihood: common
      sources:
      - organization
      - supplier
      estimated_access_time: 1 day
- name: PrimusGFS
  key: primusgfs
  mandatory_documents:
  - PrimusGFS Certificate
  alternative_groups:
  - combination_required: true
    score: 0.9
    documents:
    - Certification Agreement
    - GAP/GMP/HACCP Plan
    - Audit Reports
    condition: The Certification Agreement must be signed by the same certification body as indicated in the Audit Reports.
      The GAP/GMP/HACCP Plan should detail food safety practices consistent with the audit findings. The Audit Reports should
      clearly confirm compliance with PrimusGFS standards.
    fields_to_match:
    - organization_name
    - organization_address
    - certificate_scope
    - certification_body_name
    error_recovery:
    - error_type: unlicensed_certification_body
      action: cross_check_external_source
      message: The certification body is not recognized. Please confirm via the PrimusGFS public register or upload a valid
        certificate.
    - error_type: mismatched_scope
      action: cross_check_external_source
      message: The scope does not match across all documents. Please verify or provide consistent scope documentation.
  - combination_required: true
    score: 0.5
    documents:
    - Internal Audit Report
    - Self-Assessment Checklist
    condition: Both documents must refer to the same organization and scope and demonstrate active internal compliance monitoring
      with PrimusGFS standards.
    fields_to_match:
    - organization_name
    - organization_address
    - certificate_scope
    error_recovery:
    - error_type: corrupted_file
      action: request_reupload
      message: One or both documents are unreadable. Please reupload clear copies.
    - error_type: missing_organization_name
      action: request_corrected_document
      message: The organization name is missing. Upload documents with the complete name.
    - error_type: mismatched_certificate_scope
      action: cross_check_external_source
      message: The scope does not match between the documents. Ensure they refer to the same food safety activities.
  - combination_required: true
    score: 0.4
    documents:
    - Supplier Audit Report
    - Traceability Records
    condition: Supplier Audit Report and Traceability Records must validate the same organization, same scope, and show consistent
      traceability practices relevant to the PrimusGFS certificate.
    fields_to_match:
    - organization_name
    - certificate_scope
    - date_of_issuance
    error_recovery:
    - error_type: corrupted_file
      action: request_reupload
      message: A file is unreadable. Please reupload a clear version.
    - error_type: mismatched_scope
      action: cross_check_external_source
      message: Mismatch in scope. Ensure both documents refer to the same safety scope.
  available_alternative_documents:
  - title: Certification Agreement
    description: A formal, legally binding agreement between the organization and a certification body accredited by PrimusGFS.
      This document outlines the scope of certification, responsibilities of each party, audit rights, confidentiality terms,
      corrective action expectations, validity period, and consequences of non-compliance. It must be duly signed by both
      the organization and the accredited certification body listed in the final audit report.
    provides_fields:
    - field: organization_name
      confidence: 1
    - field: organization_address
      confidence: 1
    - field: certification_body_name
      confidence: 1
    - field: certification_body_address
      confidence: 1
    - field: date_of_agreement
      confidence: 1
    - field: scope_of_certification
      confidence: 1
    - field: date_of_expiry
      confidence: 1
    - field: signatory_name
      confidence: 0.9
    - field: signatory_position
      confidence: 0.9
    availability:
      likelihood: common
      sources:
      - certification_body
      - organization
      - internal_documentation
      estimated_access_time: 1-3 business days
  - title: GAP/GMP/HACCP Plan
    description: A technical and structured food safety document that outlines the organization's implementation of Good Agricultural
      Practices (GAP), Good Manufacturing Practices (GMP), and a validated Hazard Analysis and Critical Control Points (HACCP)
      system. While this plan includes risk assessments, roles, and monitoring activities, it may only partially contain certification-related
      metadata. Certificate details should be verified from the Certification Agreement or Final Audit Report.
    provides_fields:
    - field: organization_name
      confidence: 0.1
    - field: organization_address
      confidence: 0.7
    - field: certification_body_name
      confidence: 0.5
    - field: certification_body_address
      confidence: 0.5
    - field: scope_of_certification
      confidence: 0.5
    - field: plan_date
      confidence: 1
    - field: date_of_expiry
      confidence: 0.5
    - field: signatory_name
      confidence: 0.7
    - field: signatory_position
      confidence: 0.7
    availability:
      likelihood: common
      sources:
      - organization
      - food_safety_team
      estimated_access_time: 1-2 business days
  - title: Internal Audit Report
    description: An internal audit report conducted by the organization to verify compliance with PrimusGFS standards. It
      includes audit dates, scope of the audit, identified nonconformities, and the corresponding corrective actions. The
      report demonstrates the organization's internal monitoring system, commitment to food safety, and continuous improvement
      practices. The audit must be conducted by trained personnel and should reference the applicable food safety plan and
      relevant procedures.
    provides_fields:
    - field: organization_name
      confidence: 1
    - field: organization_address
      confidence: 0.7
    - field: certification_body_name
      confidence: 0.5
    - field: certification_body_address
      confidence: 0.5
    - field: date_of_agreement
      confidence: 0.5
    - field: scope_of_certification
      confidence: 0.6
    - field: signatory_name
      confidence: 0.9
    - field: signatory_position
      confidence: 0.9
    availability:
      likelihood: common
      sources:
      - internal
      - quality_department
      - food_safety_team
      estimated_access_time: 1-2 days
  - title: Self-Assessment Checklist
    description: A completed checklist used by the organization to perform an internal review of its compliance with PrimusGFS
      standards prior to the formal certification audit. It typically includes questions based on the standard, documented
      observations, and any preliminary corrective actions taken. The checklist helps the organization proactively identify
      gaps and prepare for the certification process.
    provides_fields:
    - field: organization_name
      confidence: 1
    - field: organization_address
      confidence: 0.8
    - field: certification_body_name
      confidence: 0.5
    - field: certification_body_address
      confidence: 0.5
    - field: scope_of_certification
      confidence: 0.8
    - field: signatory_name
      confidence: 0.8
    - field: signatory_position
      confidence: 0.8
    availability:
      likelihood: moderate
      sources:
      - internal
      - food_safety_team
      estimated_access_time: 1-3 days
  - title: Supplier Audit Report
    description: Audit report issued by a PrimusGFS-accredited certification body after auditing a supplier's facility. The
      report details audit findings, overall compliance score, non-conformities observed, corrective action deadlines, and
      certifier details. It serves as key documentation for verifying supplier compliance within the supply chain.
    provides_fields:
    - field: organization_name
      confidence: 0.1
    - field: organization_address
      confidence: 0.6
    - field: certification_body_name
      confidence: 1
    - field: certification_body_address
      confidence: 0.6
    - field: audit_date
      confidence: 1
    - field: signatory_name
      confidence: 0.8
    - field: signatory_position
      confidence: 0.8
    availability:
      likelihood: common
      sources:
      - certification_body
      - supplier
      estimated_access_time: 3-5 days
  - title: Traceability Records
    description: Records that track the movement of food products through the supply chain, supporting traceability and recall
      procedures under PrimusGFS standards.
    provides_fields:
